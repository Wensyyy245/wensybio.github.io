<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wensy</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0d1a;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg {
            position: fixed; inset: 0; z-index: 0;
            background: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=2000&auto=format&fit=crop') center/cover;
            filter: blur(6px) brightness(0.3);
            animation: bgChange 25s infinite alternate;
        }
        @keyframes bgChange { 50% { filter: blur(6px) brightness(0.4) hue-rotate(30deg); } }
        #snow { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

        .card {
            position: relative; z-index: 2;
            width: 100%; max-width: 500px;
            padding: 35px 30px;
            background: rgba(20, 15, 35, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeUp 1s ease-out forwards;
            opacity: 0; transform: translateY(30px);
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .avatar-box {
            position: relative; width: 120px; height: 120px; margin: 0 auto 20px;
        }
        .avatar-box::before {
            content: ''; position: absolute; inset: -5px; border-radius: 50%;
            background: conic-gradient(from 0deg, #a855f7, #06b6d4, #a855f7);
            animation: spin 4s linear infinite; filter: blur(10px); opacity: 0.8;
            z-index: 1;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar-box img {
            position: relative; width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; border: 3px solid rgba(255,255,255,0.2);
            background: #1a1a2e; z-index: 2; display: block;
        }

        .nick {
            font-family: 'Unbounded', sans-serif; font-size: 42px; font-weight: 700;
            background: linear-gradient(90deg, #e879f9, #22d3ee, #e879f9);
            background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite; margin-bottom: 8px;
        }
        @keyframes shimmer { to { background-position: 200%; } }
        .bio { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 25px; line-height: 1.5; }
        .bio span { color: #22d3ee; font-weight: 600; }

        .status {
            display: inline-flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 14px; margin-bottom: 25px;
            transition: 0.3s;
        }
        .status:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .dot { width: 12px; height: 12px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 50% { transform: scale(1.2); box-shadow: 0 0 20px #22c55e; } }
        .status-text { text-align: left; }
        .status-text b { display: block; font-size: 13px; }
        .status-text i { font-size: 11px; color: #22c55e; }

        .player {
            display: flex; align-items: center; gap: 15px;
            background: rgba(0,0,0,0.3); padding: 12px 15px; border-radius: 14px;
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);
        }
        .play-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            background: linear-gradient(135deg, #a855f7, #06b6d4); color: white;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0;
        }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px #a855f7; }
        
        .track-info { flex-grow: 1; text-align: left; overflow: hidden; cursor: pointer; }
        .track-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .track-title:hover { color: #22d3ee; }
        .track-artist { font-size: 11px; color: #a0a0b0; }
        
        .volume { width: 60px; accent-color: #22d3ee; cursor: pointer; }
        #fileInput { display: none; }

        .socials { display: flex; justify-content: center; gap: 25px; }
        .socials a { color: rgba(255,255,255,0.5); font-size: 24px; transition: 0.3s; }
        .socials a:hover { color: #fff; transform: translateY(-5px) scale(1.2); text-shadow: 0 0 15px #22d3ee; }

        @media (max-width: 500px) {
            .card { padding: 25px 20px; border-radius: 20px; }
            .nick { font-size: 32px; }
            .avatar-box { width: 100px; height: 100px; }
            .player { flex-direction: column; gap: 10px; }
            .track-info, .volume { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="bg"></div>
    <canvas id="snow"></canvas>

    <div class="card">
        <div class="avatar-box">
            <img src="https://raw.githubusercontent.com/Wensyyy245/wensybio.github.io/main/avatar.jpg" alt="Wensy">
        </div>

        <div class="nick">Wensy</div>
        <div class="bio"><span>Vibe Coder</span> & Owner of Bot Network</div>

        <div class="status">
            <div class="dot"></div>
            <div class="status-text">
                <b>разрабатывает новое приложение</b>
                <i>пастит</i>
            </div>
        </div>

        <div class="player">
            <input type="file" id="fileInput" accept="audio/*">
            
            <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
            
            <div class="track-info" id="trackInfo" title="Нажмите, чтобы выбрать песню">
                <div class="track-title" id="title">История</div>
                <div class="track-artist" id="artist">Ежанутый</div>
            </div>
            
            <input type="range" class="volume" id="vol" min="0" max="1" step="0.1" value="0.5">
            
            <!-- ВАЖНО: Убедитесь, что файл называется song.mp3 и лежит рядом с index.html -->
            <audio id="audio" src="song.mp3" preload="auto"></audio>
        </div>

        <div class="socials">
            <a href="https://vk.ru/wirzyyy" target="_blank"><i class="fab fa-vk"></i></a>
            <a href="https://t.me/cbwensy" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://steamcommunity.com/profiles/76561198731768255/" target="_blank"><i class="fab fa-steam"></i></a>
        </div>
    </div>

    <script>
        // --- СНЕГ ---
        const canvas = document.getElementById('snow'), ctx = canvas.getContext('2d');
        let w, h, flakes = [];
        function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
        addEventListener('resize', resize); resize();
        for(let i=0; i<100; i++) flakes.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+1, s: Math.random()+0.5 });
        function drawSnow() {
            ctx.clearRect(0,0,w,h); ctx.fillStyle = 'rgba(255,255,255,0.6)';
            flakes.forEach(f => {
                ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
                f.y += f.s; f.x += Math.sin(f.y/50)*0.5;
                if(f.y > h) { f.y = -10; f.x = Math.random()*w; }
            });
            requestAnimationFrame(drawSnow);
        } drawSnow();

        // --- ПЛЕЕР ---
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const fileInput = document.getElementById('fileInput');
        const trackInfo = document.getElementById('trackInfo');

        // Проверка: если браузер не может загрузить song.mp3, меняем текст
        audio.addEventListener('error', () => {
            title.textContent = "Файл не найден";
            artist.textContent = "Нажмите сюда, чтобы выбрать";
        });

        // Клик по тексту -> выбор файла с компьютера
        trackInfo.onclick = () => fileInput.click();

        // Выбор файла вручную
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            audio.src = URL.createObjectURL(file);
            title.textContent = file.name.replace(/\.[^/.]+$/, "");
            artist.textContent = "Локальный файл";
            // Сбрасываем кнопку в исходное состояние перед игрой
            playBtn.innerHTML = '<i class="fas fa-play"></i>'; 
            audio.load();
        };

        // Кнопка Play / Pause
        playBtn.onclick = () => {
            // Если файл не найден (ошибка загрузки), принудительно открываем выбор файла
            if (audio.error) {
                fileInput.click();
                return;
            }

            if (audio.paused) {
                // Используем промис (обещание) для обработки ошибок
                audio.play().then(() => {
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch((error) => {
                    // Если браузер заблокировал звук или файла нет
                    console.log("Ошибка воспроизведения:", error);
                    fileInput.click();
                });
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        };

        // Событие окончания песни (возвращаем кнопку play)
        audio.onended = () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        };

        // Громкость
        document.getElementById('vol').oninput = (e) => audio.volume = e.target.value;
    </script>
</body>
</html>
